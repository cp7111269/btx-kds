<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BTX KDS — Order Display</title>
<style>
/* ===========================================================
   BTX KDS - Customer pickup display
   BT xTech Sdn Bhd

   Different job from the kitchen screen, so different rules:
   - Read from across a room, by someone not wearing their glasses. Numbers are
     enormous; everything else is small.
   - No interaction at all. This screen is behind a counter on a TV; nobody
     touches it and nothing on it should invite touching.
   - An order appears under READY only when EVERY station has finished it.
     Calling someone up while their food is still cooking wastes their trip.
   - Self-contained, no CDN. The shop's internet is not this screen's problem.
   =========================================================== */
:root{
  --brand-blue:#1C74BB; --brand-orange:#F26522; --brand-yellow:#FDB913;
  --bg:#0d1117; --panel:#161b22; --line:#2d3648;
  --txt:#f0f4f8; --dim:#9aa7b8; --mute:#7d8b9e;
  --ready:#2ea043;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Segoe UI",system-ui,"Microsoft JhengHei","Noto Sans SC",sans-serif;
  overflow:hidden; display:flex; flex-direction:column; user-select:none;
  cursor:none;                      /* nothing here is clickable */
}

#top{
  flex:0 0 auto; height:72px; background:var(--panel);
  border-bottom:2px solid var(--line);
  display:flex; align-items:center; gap:16px; padding:0 26px;
}
/* The shop's name is the heading here. Nothing on a customer-facing board
   should advertise the system behind it. */
#shop{
  font-size:26px; font-weight:800; color:var(--txt); letter-spacing:.5px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60vw;
}
#shop:empty:after{content:"Order Status"; color:var(--dim); font-weight:700}
#top .sp{flex:1}
#dot{width:11px; height:11px; border-radius:50%; background:var(--ready);
     box-shadow:0 0 9px var(--ready)}
#dot.off{background:#f0503a; box-shadow:0 0 9px #f0503a}
#clock{font-size:30px; font-weight:700; font-variant-numeric:tabular-nums}

#cols{flex:1; display:flex; min-height:0}
.col{flex:1; display:flex; flex-direction:column; min-width:0}
.col + .col{border-left:2px solid var(--line)}
.col h2{
  flex:0 0 auto; text-align:center; padding:18px 10px;
  font-size:26px; font-weight:800; letter-spacing:4px;
}
.col.prep h2{color:var(--dim); background:rgba(255,255,255,.03)}
.col.rdy  h2{color:#fff; background:var(--ready)}
/* One order per row. A wrapping grid of huge digits only works for short
   pickup numbers; an order still in progress has no OrderNo at all, so the
   board has to be able to show a full document number like T01-HB000016
   without it wrapping or shrinking to nothing. */
.grid{
  flex:1; min-height:0; overflow:hidden;
  display:flex; flex-direction:column; align-items:stretch;
  gap:10px; padding:18px 22px;
}
.no{
  font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1;
  border-radius:12px; padding:14px 22px; text-align:center;
  font-size:44px; letter-spacing:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.no .sub{
  display:block; font-size:15px; font-weight:600; letter-spacing:1px;
  opacity:.75; margin-top:5px;
}
.prep .no{background:var(--panel); color:var(--dim); border:2px solid var(--line)}
.rdy  .no{background:var(--ready); color:#fff}
/* A number that has just become ready has to catch an eye that is not looking
   at the screen, so it flashes for a while and then settles. */
.rdy .no.fresh{animation:pop 1s ease-out, flash 1.1s ease-in-out 6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{0%,100%{background:var(--ready)}50%{background:var(--brand-yellow); color:#0d1117}}

.empty{
  width:100%; text-align:center; color:var(--mute);
  font-size:21px; font-style:italic; padding-top:40px;
}
#foot{
  flex:0 0 auto; padding:9px 26px; background:var(--panel);
  border-top:1px solid var(--line); display:flex; align-items:center; gap:14px;
  font-size:13px; color:var(--mute);
}
#foot .sp{flex:1}

/* a 4K TV across a room needs every pixel of it */
@media (min-width:1800px){
  .no{font-size:60px; padding:20px 28px}
  .col h2{font-size:32px}
}
@media (max-width:900px){
  .no{font-size:30px; padding:11px 16px}
  .no .sub{font-size:12px}
  .col h2{font-size:20px; letter-spacing:2px}
}
</style>
</head>
<body>

<div id="top">
  <div id="shop"></div>
  <div class="sp"></div>
  <div id="dot"></div>
  <div id="clock">--:--</div>
</div>

<div id="cols">
  <div class="col prep">
    <h2>PREPARING</h2>
    <div class="grid" id="g-prep"></div>
  </div>
  <div class="col rdy">
    <h2>READY</h2>
    <div class="grid" id="g-ready"></div>
  </div>
</div>

<div id="foot">
  <span id="status">Connecting…</span>
  <span class="sp"></span>
  <span id="credit">BT xTech Sdn Bhd &middot; support@btxtech.my</span>
</div>

<script>
"use strict";
/* ===========================================================
   Settings live in the URL so this screen needs no setup panel - it is a TV
   with no keyboard. e.g.  ?shop=Kopitiam&sound=0&max=12
   =========================================================== */
function q(name, dflt){
  var m = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : dflt;
}
var SHOP  = q("shop", "");
var SOUND = q("sound", "1") !== "0";
var MAXN  = Math.max(1, Number(q("max", "12")) || 12);
/* doc  = the full document number, e.g. T01-HB000016  (default: always present)
   no   = the short pickup number      - only exists once the POS assigns one
   table= the table number                                                    */
var SHOWAS = q("no", "doc");
var COMPANY = "";
/* ?brand=0 removes our name from the footer too, for a shop that wants the
   board carrying nothing but their own identity */
if(q("brand", "1") === "0"){
  var cr = document.getElementById("credit");
  if(cr) cr.textContent = "";
}

function label(e){
  if(SHOWAS === "no")    return e.no || e.docNo || "";
  if(SHOWAS === "table") return e.table || e.docNo || "";
  return e.docNo || e.no || "";
}
function sublabel(e){
  if(SHOWAS === "doc") return e.table ? "TABLE " + e.table : "";
  return e.docNo || "";
}

function $(id){ return document.getElementById(id); }

/* ---------- chime (WebAudio, nothing external) ----------
   Same browser limitation as the kitchen screen: no sound until someone has
   touched the page. A TV never gets touched, so on a real install this runs
   inside the Android shell where the native player has no such rule. */
var actx = null;
function chime(){
  if(!SOUND) return;
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!actx) actx = new AC();
    if(actx.state === "suspended") actx.resume();
    [880, 1174].forEach(function(f, i){
      var t0 = actx.currentTime + i * 0.16;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + 0.6);
    });
  }catch(e){ /* never let audio break the board */ }
}

/* ---------- render ---------- */
var knownReady = {};        // number -> already announced
var readySince = {};        // number -> when it first appeared under READY
var lastRev = -1;
var booted = false;
/* How long a newly ready number keeps flashing. Held by timestamp rather than
   by a CSS class alone, so it survives the repaints that happen while it is
   still flashing - otherwise the flash is wiped almost immediately. */
var FLASH_MS = 9000;

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}

function paint(d){
  var prep = (d.preparing || []).slice(0, MAXN);
  var ready = (d.ready || []).slice(0, MAXN);

  $("g-prep").innerHTML = prep.length
    ? prep.map(function(e){
        var sub = sublabel(e);
        return '<div class="no">' + esc(label(e))
             + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</div>';
      }).join("")
    : '<div class="empty">Nothing being prepared</div>';

  var fresh = false, now = Date.now();
  $("g-ready").innerHTML = ready.length
    ? ready.map(function(e){
        /* announce a number the first time it lands here, and never on the
           first load - otherwise every number screams when the TV reboots */
        var isNew = booted && !knownReady[e.no];
        if(isNew){ fresh = true; readySince[e.no] = now; }
        var flashing = readySince[e.no] && (now - readySince[e.no] < FLASH_MS);
        var sub = sublabel(e);
        return '<div class="no' + (flashing ? " fresh" : "") + '">' + esc(label(e))
             + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</div>';
      }).join("")
    : '<div class="empty">Nothing waiting</div>';

  var seen = {};
  ready.forEach(function(e){ seen[e.no] = 1; });
  Object.keys(readySince).forEach(function(k){ if(!seen[k]) delete readySince[k]; });
  knownReady = seen;
  if(fresh) chime();
  booted = true;

  $("status").textContent = "Preparing " + (d.preparing || []).length
    + "  ·  Ready " + (d.ready || []).length
    + ((d.preparing || []).length > MAXN || (d.ready || []).length > MAXN
        ? "  ·  showing the first " + MAXN + " of each" : "");
}

function poll(){
  fetch("/api/display", {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
    .then(function(d){
      $("dot").classList.toggle("off", !d.ok);
      if(!d.ok){
        $("status").textContent = "Kitchen system unreachable" + (d.error ? " — " + d.error : "");
        return;
      }
      if(d.company && d.company !== COMPANY){
        COMPANY = d.company;
        /* the shop's own name unless the URL overrides it - a board facing
           customers should carry the restaurant's name, not ours */
        if(!SHOP) $("shop").textContent = COMPANY;
      }
      if(d.rev !== lastRev){ lastRev = d.rev; paint(d); }
    })
    .catch(function(){
      $("dot").classList.add("off");
      $("status").textContent = "Reconnecting…";
    });
}

function tick(){
  $("clock").textContent = new Date().toTimeString().slice(0,5);
}

poll(); tick();
setInterval(poll, 2000);
setInterval(tick, 1000);
/* a TV that has been asleep should not show a stale board for two seconds */
document.addEventListener("visibilitychange", function(){
  if(!document.hidden){ poll(); tick(); }
});
</script>
</body>
</html>
